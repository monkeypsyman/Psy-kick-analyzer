name: Rebuild analyzer bundle

on:
  push:
    branches: [main]
    paths:
      - 'analyzer/**'
      - 'build.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bundle
        run: python build.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet analyzer_bundle.py; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add analyzer_bundle.py
            git commit -m "Rebuild analyzer_bundle.py"
            git push
          else
            echo "bundle unchanged"
          fi