name: Rebuild analyzer bundle

on:
  push:
    branches: [main]
    paths:
      - 'analyzer/**'
      - 'build.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bundle
        run: python build.py
      - name: Commit if changed
        run: |
          git add -A analyzer_bundle.py
          if ! git diff --cached --quiet; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "Rebuild analyzer_bundle.py"
            git push
          else
            echo "no changes"
          fi