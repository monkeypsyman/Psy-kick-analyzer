<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psy Kick Analyzer</title>
<style>
  html, body { background:#0f1216; color:#ccd; margin:0; padding:16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { color:#4fd6e0; font-size:15px; margin:0 0 4px 0; }
  .sub { color:#667; font-size:11px; margin:0 0 16px 0; }
  #drop { border:2px dashed #334; border-radius:6px; padding:28px;
    text-align:center; color:#667; cursor:pointer; font-size:12px; }
  #drop.hover { border-color:#4fd6e0; color:#4fd6e0; background:#0e1a1e; }
  #drop input { display:none; }
  #status { font-size:11px; color:#a78bfa; padding:8px 0; min-height:1em; }
  #err { font-size:11px; color:#ff5f6d; white-space:pre-wrap; }
  .panel { background:#0a0d10; border:1px solid #223; border-radius:3px;
    margin:10px 0; padding:6px 8px 8px 8px; }
  .panel h3 { font-size:10px; color:#4fd6e0; margin:0 0 4px 0;
    letter-spacing:.4px; font-weight:600; }
  canvas { display:block; width:100%; height:180px; background:#0a0d10; }
  #playRow { margin:10px 0; display:none; }
  button { background:#4fd6e0; color:#04252a; border:0;
    padding:7px 14px; font-family:inherit; font-size:11px;
    font-weight:700; border-radius:3px; cursor:pointer;
    margin-right:6px; letter-spacing:.4px; }
  button.stop { background:#ff5f6d; color:#2a0407; }
  button:hover { filter:brightness(1.15); }
  #fp { font-size:11px; color:#889; line-height:1.7;
    border-top:1px dashed #223; padding-top:12px; margin-top:12px; }
  #fp b { color:#a78bfa; }
  #fp .val { color:#5ee08a; }
  .legend { font-size:10px; color:#667; margin:4px 0 0 0; }
  .legend span { margin-right:12px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:5px; vertical-align:middle; }
</style>
</head>
<body>
<h1>Psy Kick Analyzer</h1>
<p class="sub">Drop a WAV. Python (Pyodide/WASM) analyzes it. Canvas renders.</p>

<div id="drop">
  <input type="file" id="file" accept=".wav">
  <div>Click or drop a WAV here</div>
</div>
<div id="status"></div>
<div id="err"></div>

<div id="panels" style="display:none;">
  <div class="panel">
    <h3>WAVEFORM + LANDMARKS</h3>
    <canvas id="p_wave"></canvas>
    <div class="legend">
      <span><span class="dot" style="background:#ff5f6d"></span>attack</span>
      <span><span class="dot" style="background:#ffb347"></span>valley</span>
      <span><span class="dot" style="background:#5ee08a"></span>reswell</span>
    </div>
  </div>
  <div class="panel">
    <h3>ENVELOPE COMPARISON</h3>
    <canvas id="p_env"></canvas>
  </div>
  <div class="panel">
    <h3>SPECTROGRAM</h3>
    <canvas id="p_spec"></canvas>
  </div>
  <div class="panel">
    <h3>PITCH TRACE</h3>
    <canvas id="p_pitch"></canvas>
  </div>
  <div class="panel">
    <h3>SPECTRAL CENTROID</h3>
    <canvas id="p_cent"></canvas>
  </div>
  <div class="panel">
    <h3>ATTACK ZOOM (0-50 ms)</h3>
    <canvas id="p_zoom"></canvas>
  </div>
</div>

<div id="playRow">
  <button id="play">PLAY</button>
  <button class="stop" id="stop">STOP</button>
  <button id="dl">DOWNLOAD JSON</button>
</div>

<div id="fp"></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script src="app.js"></script>
<script>
setTimeout(function () {
  var s = document.getElementById('status');
  if (s && !s.textContent.trim()) {
    s.style.color = '#ff5f6d';
    s.textContent = 'app.js did not run. Check the file exists and the console for errors.';
  }
}, 5000);
</script>
</body>
</html>
