<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Psy Kick Analyzer</title>
<style>
  html, body { background:#0f1216; color:#ccd; margin:0; padding:20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { color:#4fd6e0; font-size:16px; margin:0 0 4px 0; }
  .sub { color:#667; font-size:11px; margin:0 0 20px 0; }
  #drop { border:2px dashed #334; border-radius:6px; padding:36px;
    text-align:center; color:#667; cursor:pointer; transition: all .15s;
    font-size:12px; }
  #drop.hover { border-color:#4fd6e0; color:#4fd6e0; background:#0e1a1e; }
  #drop input { display:none; }
  #status { font-size:11px; color:#a78bfa; padding:8px 0; min-height:1em; }
  #err { font-size:11px; color:#ff5f6d; white-space:pre-wrap; }
  canvas { display:block; background:#0a0d10; border:1px solid #223;
    border-radius:3px; margin:14px 0; width:100%; height:260px; }
  #fp { font-size:11px; color:#889; line-height:1.7;
    border-top:1px dashed #223; padding-top:12px; margin-top:12px; }
  #fp b { color:#a78bfa; }
  #fp .val { color:#5ee08a; }
  button { background:#4fd6e0; color:#04252a; border:0;
    padding:7px 14px; font-family:inherit; font-size:11px;
    font-weight:700; border-radius:3px; cursor:pointer;
    margin-right:6px; letter-spacing:.4px; }
  button.stop { background:#ff5f6d; color:#2a0407; }
  button:hover { filter:brightness(1.15); }
  .legend { font-size:10px; color:#667; margin:8px 0; }
  .legend span { margin-right:14px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:5px; vertical-align:middle; }
</style>
</head>
<body>
<h1>Psy Kick Analyzer</h1>
<p class="sub">Drop a WAV. Python (Pyodide/WASM) analyzes it. Canvas renders.</p>

<div id="drop">
  <input type="file" id="file" accept=".wav">
  <div>Click or drop a WAV here</div>
</div>
<div id="status"></div>
<div id="err"></div>

<canvas id="scope"></canvas>
<div class="legend">
  <span><span class="dot" style="background:#ff5f6d"></span>attack</span>
  <span><span class="dot" style="background:#ffb347"></span>valley</span>
  <span><span class="dot" style="background:#5ee08a"></span>reswell</span>
</div>

<div id="playRow" style="display:none;">
  <button id="play">PLAY</button>
  <button class="stop" id="stop">STOP</button>
  <button id="dl">DOWNLOAD JSON</button>
</div>

<div id="fp"></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
const SR = 44100;
let pyodide = null;
let lastX = null;
let lastFingerprint = null;
let audioCtx = null, currentSrc = null;

const $ = id => document.getElementById(id);
const status = m => { $('status').textContent = m; };
const err    = m => { $('err').textContent = m; };

async function boot() {
  status('Loading Pyodide...');
  pyodide = await loadPyodide({
    indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'
  });
  status('Loading numpy + scipy...');
  await pyodide.loadPackage(['numpy', 'scipy']);
  status('Fetching analyzer bundle...');
  const code = await (await fetch('./analyzer_bundle.py')).text();
  pyodide.FS.writeFile('/analyzer.py', code);
  await pyodide.runPythonAsync('import sys; sys.path.insert(0, "/")');
  await pyodide.runPythonAsync('import analyzer');
  status('Ready. Drop a WAV.');
}

async function handleFile(file) {
  err('');
  status('Reading ' + file.name + '...');
  try {
    const buf = await file.arrayBuffer();
    lastX = await decodeWav(buf);
    status('Analyzing ' + (lastX.length / SR * 1000).toFixed(1) + ' ms...');
    await new Promise(r => setTimeout(r, 20));
    await analyze();
    status('Done.');
  } catch (e) {
    console.error(e);
    err('Error: ' + e.message);
    status('');
  }
}

function decodeWav(arrayBuffer) {
  return new Promise((resolve, reject) => {
    const c = new OfflineAudioContext(1, SR, SR);
    c.decodeAudioData(arrayBuffer.slice(0), ab => {
      let mono;
      const ch0 = ab.getChannelData(0);
      if (ab.numberOfChannels > 1) {
        mono = new Float32Array(ch0.length);
        for (let i = 0; i < ch0.length; i++) {
          let s = 0;
          for (let ch = 0; ch < ab.numberOfChannels; ch++)
            s += ab.getChannelData(ch)[i];
          mono[i] = s / ab.numberOfChannels;
        }
      } else {
        mono = new Float32Array(ch0);
      }
      if (ab.sampleRate !== SR) {
        console.warn('File rate ' + ab.sampleRate + ' != ' + SR +
                     '; measurements may be off.');
      }
      resolve(mono);
    }, reject);
  });
}

async function analyze() {
  pyodide.globals.set('_x', lastX);
  pyodide.globals.set('_sr', SR);
  const res = await pyodide.runPythonAsync(`
    import analyzer, json
    _r = analyzer.analyze_array(_x, _sr, source='<browser>', verbose=False)
    _fp = analyzer.to_json(_r)
    json.dumps({'fp': _fp})
  `);
  const parsed = JSON.parse(res);
  lastFingerprint = parsed.fp;
  renderFingerprint(parsed.fp);
  const arrays = await pyodide.runPythonAsync(`
    k = _r['kicks'][0] if _r['kicks'] else None
    out = None
    if k is not None:
        a = k['_arrays']
        out = {
            't_env': a['t_env'].tolist(),
            'v_env': a['v_env'].tolist(),
            'seg':   a['seg'].tolist(),
        }
    out
  `);
  if (arrays) {
    const env = parsed.fp.kicks[0]?.detail?.envelope || {};
    drawScope($('scope'), arrays.seg, arrays.t_env, arrays.v_env, env);
  }
  $('playRow').style.display = 'block';
}

function renderFingerprint(fp) {
  const k = fp.kicks && fp.kicks[0];
  if (!k) { $('fp').innerHTML = '<i>no kicks found</i>'; return; }
  const f  = v => (v == null ? '-' : (typeof v === 'number' ? v.toFixed(3) : v));
  const f2 = v => (v == null ? '-' : (typeof v === 'number' ? v.toFixed(2) : v));
  $('fp').innerHTML = `
    <b>id</b> <span class="val">${fp.id}</span> &middot;
    <b>class</b> <span class="val">${k.class || '?'}</span>
    (raw peak <span class="val">${f2(k.raw_peak_ms)} ms</span>)<br>
    <b>duration</b> <span class="val">${f(k.duration_ms)} ms</span> &middot;
    <b>attack</b> <span class="val">${f(k.attack_t_ms)} ms</span> &middot;
    <b>valley</b> <span class="val">${f2(k.valley_t_ms)} ms @ ${f(k.valley_level_pct)}%</span> &middot;
    <b>reswell</b> <span class="val">${f2(k.reswell_t_ms)} ms @ ${f(k.reswell_level_pct)}%</span><br>
    <b>f0</b> <span class="val">${f2(k.f_settled_hz)} Hz</span>
    (agree <span class="val">${f2(k.f_settled_agreement_hz)} Hz</span>)<br>
    <b>click</b> <span class="val">${k.click_present ? 'present' : 'none'} ${f2(k.click_ratio_db)} dB</span> &middot;
    <b>2nd harm</b> <span class="val">${f2(k.harmonic_ratio_2f0_db)} dB</span>
  `;
}

function drawScope(canvas, seg, t_env, v_env, env) {
  const dpr = window.devicePixelRatio || 1;
  const W = 1200, H = 260;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const padL = 52, padR = 16, padT = 18, padB = 28;
  const pw = W - padL - padR, phh = H - padT - padB;
  const tmax = Math.min(300, seg.length / SR * 1000);
  const nMax = Math.min(seg.length, Math.floor(tmax / 1000 * SR));

  ctx.strokeStyle = '#1a2028';
  for (let ms = 0; ms <= tmax; ms += 25) {
    const px = padL + (ms / tmax) * pw;
    ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, padT + phh);
    ctx.stroke();
  }
  for (let a = -1; a <= 1.0001; a += 0.5) {
    const py = padT + phh / 2 - a * phh / 2;
    ctx.beginPath(); ctx.moveTo(padL, py); ctx.lineTo(padL + pw, py);
    ctx.stroke();
  }

  ctx.strokeStyle = '#4fd6e0'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < nMax; i++) {
    const px = padL + (i / nMax) * pw;
    const py = padT + phh / 2 - seg[i] * phh / 2 * 0.92;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,179,71,0.9)';
  for (let i = 0; i < t_env.length; i++) {
    if (t_env[i] > tmax) break;
    const px = padL + (t_env[i] / tmax) * pw;
    const py = padT + phh / 2 - v_env[i] * phh / 2 * 0.92;
    ctx.beginPath(); ctx.arc(px, py, 1.5, 0, Math.PI * 2); ctx.fill();
  }

  const marks = [
    { t: env.attack_t_ms, c: '#ff5f6d', label: 'attack' },
    { t: env.valley_t_ms, c: '#ffb347', label: 'valley' },
    { t: env.reswell_t_ms, c: '#5ee08a', label: 'reswell' },
  ];
  ctx.font = '10px ui-monospace, monospace';
  for (const m of marks) {
    if (m.t == null || m.t < 0 || m.t > tmax) continue;
    const px = padL + (m.t / tmax) * pw;
    ctx.strokeStyle = m.c; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, padT + phh);
    ctx.stroke();
    ctx.fillStyle = m.c;
    ctx.fillText(m.label + ' ' + m.t.toFixed(1) + 'ms',
                 Math.min(px + 4, W - 110), padT + 12);
  }

  ctx.fillStyle = '#556';
  for (let ms = 0; ms <= tmax; ms += 50) {
    const px = padL + (ms / tmax) * pw;
    ctx.fillText(ms + 'ms', px + 2, H - 8);
  }
}

function getCtx() {
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate: SR });
  return audioCtx;
}
function play() {
  if (!lastX) return;
  const c = getCtx();
  if (c.state === 'suspended') c.resume();
  stop();
  const buf = c.createBuffer(1, lastX.length, SR);
  buf.copyToChannel(lastX, 0);
  const src = c.createBufferSource();
  src.buffer = buf; src.connect(c.destination); src.start();
  currentSrc = src;
}
function stop() {
  if (currentSrc) { try { currentSrc.stop(); } catch(e){} currentSrc = null; }
}
function downloadFp() {
  if (!lastFingerprint) return;
  const blob = new Blob([JSON.stringify(lastFingerprint, null, 2)],
                        { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (lastFingerprint.id || 'kick') + '.fingerprint.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const drop = $('drop');
drop.onclick = () => $('file').click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hover'); };
drop.ondragleave = () => drop.classList.remove('hover');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('hover');
  const f = e.dataTransfer.files[0]; if (f) handleFile(f);
};
$('file').onchange = e => { const f = e.target.files[0]; if (f) handleFile(f); };
$('play').onclick = play;
$('stop').onclick = stop;
$('dl').onclick = downloadFp;

boot().catch(e => { console.error(e); err('Boot failed: ' + e.message); });
</script>
</body>
</html>
